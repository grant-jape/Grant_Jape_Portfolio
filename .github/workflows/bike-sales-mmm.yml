name: 📈 Bike Sales MMM – run analysis

# Re-runs the model only when this project's files change.
on:
  push:
    branches: [main]
    paths:
      - "projects/bike-sales-mmm/**"
      - "!projects/bike-sales-mmm/charts/**"
      - "!projects/bike-sales-mmm/reports/**"
  workflow_dispatch:

permissions:
  contents: write

# Both project workflows commit to main; queue them so they never push at the same time.
concurrency:
  group: project-analysis-autocommit
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/bike-sales-mmm   # scripts use paths relative to the project folder

jobs:
  run_python_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # start from the latest main, including any earlier bot commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn statsmodels

      - name: Run analysis
        run: python run_analysis.py

      - name: Commit updated outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Bike Sales MMM: update charts and results"
          file_pattern: >-
            projects/bike-sales-mmm/charts/*
            projects/bike-sales-mmm/reports/*
            projects/bike-sales-mmm/*.csv
