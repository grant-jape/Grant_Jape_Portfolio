name: 🌐 Deploy site to GitHub Pages

# The site is plain HTML/CSS/JS: no build step, the repo is published as-is.
on:
  push:
    branches: [main]
  # Charts committed by the analysis workflows don't trigger a push event,
  # so redeploy whenever one of them finishes.
  workflow_run:
    workflows: ["📈 Bike Sales MMM – run analysis", "📈 Claims Model – run analysis"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Upload site (repo minus tooling)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
