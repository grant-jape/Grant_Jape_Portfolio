<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Grant Jape</title>
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <style>
    /* 404 is served at any depth, so it can't rely on a relative stylesheet path. */
    :root { --paper:#f3f5f2; --ink:#13202e; --muted:#586776; --teal:#0b7a75; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#0e1621; --ink:#e3e9f0; --muted:#94a3b3; --teal:#45c1b5; color-scheme: dark; } }
    :root[data-theme="dark"] { --paper:#0e1621; --ink:#e3e9f0; --muted:#94a3b3; --teal:#45c1b5; color-scheme: dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
      font:400 1rem/1.6 "IBM Plex Sans", system-ui, sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
    main { display:grid; gap:14px; max-width:36rem; }
    .code { font:500 0.85rem/1 "IBM Plex Mono", monospace; color:var(--muted); letter-spacing:.06em; }
    h1 { font:700 clamp(2rem, 6vw, 3rem)/1.1 "Bricolage Grotesque", system-ui, sans-serif; margin:0; }
    p { margin:0; color:var(--muted); }
    a { color:var(--teal); }
  </style>
</head>
<body>
  <main>
    <span class="code">404 · OUTLIER</span>
    <h1>This page is outside the data.</h1>
    <p>The link may be old or mistyped. <a href="/" id="home">Go to the home page</a>.</p>
  </main>
  <script>
    // On github.io the site lives under /Grant_Jape_Portfolio/; on a custom domain it's at the root.
    if (location.hostname.endsWith("github.io")) document.getElementById("home").href = "/Grant_Jape_Portfolio/";
  </script>
</body>
</html>
